name: Validate language catalogue

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
      - run: php -l scripts/build_catalog.php && php -l scripts/sync.php && php -l scripts/validate_catalog.php
      - run: php scripts/validate_catalog.php
