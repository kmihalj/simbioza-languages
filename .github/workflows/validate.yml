name: Validate language catalogue

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    steps:
      - name: Check out catalogue
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring

      - name: Check PHP syntax
        run: |
          for script in scripts/*.php; do
            php -l "$script"
          done

      - name: Verify all released packs
        run: php scripts/validate_catalog.php

      - name: Verify compatibility with the published Simbioza baseline
        run: |
          git clone --quiet --depth 1 --branch 0.3.16 https://github.com/kmihalj/Simbioza.git "$RUNNER_TEMP/simbioza-language-source"
          composer --working-dir="$RUNNER_TEMP/simbioza-language-source" update --no-interaction --no-progress --prefer-dist
          php scripts/validate_source.php "$RUNNER_TEMP/simbioza-language-source"
